name: Build Mystic Kernel SDM660

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig yang akan digunakan (default: mystic-a26x_defconfig)'
        required: true
        default: 'mystic-a26x_defconfig'
      lto:
        description: 'Mode optimasi LTO (thin, full, none)'
        required: true
        default: 'thin'
      clang_version:
        description: 'Versi kompiler Clang (contoh: 12, 14, 15)'
        required: true
        default: '14'
      enable_susfs:
        description: 'Aktifkan Penyuntikan SUSFS (true/false)'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel Mi 6X
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: ⏰ Checkout Kernel Source
        uses: actions/checkout@v5
        with:
          ref: BakaSU
          submodules: 'recursive' # Menjamin folder KernelSU otomatis terunduh formal
          fetch-depth: 0

      - name: 🧹 Bersihkan Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "\$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: 📦 Pasang Dependensi Lingkungan Build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf \
            gcc-aarch64-linux-gnu \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip aria2

      - name: 💾 Atur Memori Virtual Swap (8GB)
        run: |
          if swapon --show | grep -q .; then
            echo "Swap sudah aktif."
            exit 0
          fi
          if [ -f /swapfile ]; then
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
          fi
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Swap Aktif ==="
          free -h

      - name: 🔧 Pasang Clang & LLVM Toolchain
        run: |
          CLANG_VER="\${{ github.event.inputs.clang_version }}"
          echo "Memasang Clang/LLVM versi \$CLANG_VER"
          sudo apt-get install -y clang-\$CLANG_VER lld-\$CLANG_VER llvm-\$CLANG_VER

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-\$CLANG_VER 200
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-\$CLANG_VER 200
          clang --version
          ld.lld --version

      - name: ⚔️ Pasang Kompiler Silang ARM32 (GCC-32)
        run: |
          sudo apt-get install -y gcc-arm-linux-gnueabi
          arm-linux-gnueabi-gcc --version || true

      - name: 🪝 Integrasi dan Suntik Berkas Patch SUSFS
        if: github.event.inputs.enable_susfs == 'true'
        run: |
          echo "[+] Memulai proses integrasi Driver SUSFS v1.5.1..."
          
          # 1. Unduh repositori resmi driver SUSFS eksternal
          git clone https://gitlab.com susfs_source
          
          # 2. Salin folder driver susfs ke dalam susunan drivers/ utama kernel
          cp -r susfs_source/broken_edge/susfs drivers/
          
          # 3. Modifikasi Kconfig dan Makefile utama agar mendeteksi modul susfs
          grep -q "susfs" drivers/Makefile || printf "\nobj-\$(CONFIG_SUSFS) += susfs/\n" >> drivers/Makefile
          grep -q "source \"drivers/susfs/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/susfs/Kconfig\"" drivers/Kconfig
          
          # 4. Cari berkas patch patch .patch khusus kernel 4.19 jika tersedia
          # Menyelaraskan struktur header agar aman dari pelacakan KernelSU
          if [ -d "susfs_source/Patches" ]; then
            echo "[+] Menerapkan kernel level patch untuk SUSFS..."
            # Menghindari bentrok pelacakan, jalankan salah satu patch generic jika cocok:
            # git apply susfs_source/Patches/Kernel-4.19/*.patch || echo "[!] Melewati automatic generic patch"
          fi
          
          # 5. Suntikkan konfigurasi SUSFS secara paksa ke dalam berkas defconfig Anda
          DEFCONFIG_PATH="./arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_SUSFS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_SUS_PATH=\"/data/adb/susfs\"" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG_PATH"
            echo "[+] SUSFS Sukses ditambahkan ke $DEFCONFIG_PATH"
          fi

      - name: 🏎️ Konfigurasi Cache Kompiler (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3G
          key: \${{ runner.os }}-clang-\${{ github.event.inputs.clang_version }}-\${{ github.event.inputs.defconfig }}

      - name: 🗺️ Ekspor Variabel Lingkungan Kompilasi
        run: |
          echo "ARCH=arm64" >> \$GITHUB_ENV
          echo "SUBARCH=arm64" >> \$GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> \$GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> \$GITHUB_ENV
          echo "CC=clang" >> \$GITHUB_ENV
          echo "PATH=/usr/lib/ccache:\$PATH" >> \$GITHUB_ENV

      - name: 🛠️ Pembuatan Berkas Konfigurasi (Generate Defconfig)
        run: |
          DEFCONFIG="\${{ github.event.inputs.defconfig }}"
          echo "Menggunakan berkas defconfig: \$DEFCONFIG"
          make O=out LLVM=1 LLVM_IAS=1 \$DEFCONFIG

      - name: 🚀 Memulai Proses Build Kernel
        run: |
          LTO_MODE="\${{ github.event.inputs.lto }}"
          LTO_FLAG=""
          if [ "\$LTO_MODE" != "none" ]; then
            LTO_FLAG="LTO=\$LTO_MODE"
          fi

          make -j\$(nproc --all) O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            \$LTO_FLAG \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CC="ccache clang" \
            2>&1 | tee build.log

      - name: 📊 Validasi Hasil Output Kompilasi
        if: always()
        run: |
          echo "=== Pemeriksaan Berkas Output Boot ==="
          ls -la out/arch/arm64/boot/ || true
          echo ""
          echo "=== Pemeriksaan Akhir Log Kompilasi ==="
          tail -n 100 build.log || true

        - name: 🔩 Pengepakan Arsip Flashable Zip (AnyKernel3 Mi 6X)
        id: pack
        if: success()
        run: |
          set -e
          TIMESTAMP=\$(date +'%Y%m%d-%H%M')
          BOOT=out/arch/arm64/boot
          ZIPNAME="Mystic-Kernel-ArzenDy-\${TIMESTAMP}.zip"

          git clone --depth=1 https://github.com anykernel

          if [ -f "\$BOOT/Image.gz-dtb" ]; then
            cp "\$BOOT/Image.gz-dtb" anykernel/
          elif [ -f "\$BOOT/Image.gz" ]; then
            echo "[!] Berkas Image.gz-dtb tidak ditemukan, menggunakan Image.gz"
            cp "\$BOOT/Image.gz" anykernel/
          fi

          cd anykernel
          zip -r9 "../\$ZIPNAME" . -x ".git*" "README.md" "*placeholder"
          cd ..

          mkdir -p release
          [ -f "\(BOOT/Image.gz-dtb" ] && cp "\)BOOT/Image.gz-dtb" release/ || true
          [ -f "\(BOOT/Image" ]        && cp "\)BOOT/Image"        release/ || true
          [ -f "\(BOOT/Image.gz" ]     && cp "\)BOOT/Image.gz"     release/ || true

          echo "zipname=ZIPNAME" >> GITHUB_OUTPUT
          echo "timestamp=TIMESTAMP" >> GITHUB_OUTPUT
          ls -la "\$ZIPNAME" release/

      - name: 🚀 Menerbitkan Rilis Resmi ke GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mystic-\({{ github.run_number }}-\){{ steps.pack.outputs.timestamp }}
          name: Mystic Kernel #\({{ github.run_number }} (\){{ steps.pack.outputs.timestamp }})
          body: |
            ### Detail Kompilasi Kernel:
            * **Defconfig yang dipakai**: `${{ github.event.inputs.defconfig }}`
            * **Mode Optimasi LTO**: `${{ github.event.inputs.lto }}`
            * **Versi LLVM/Clang**: `Clang ${{ github.event.inputs.clang_version }}`
            * **Status Driver SUSFS**: `${{ github.event.inputs.enable_susfs }}`

            ### Unduhan Berkas Rilis:
            * Berkas Flashable Zip (Silakan Flash lewat TWRP/OrangeFox): **`${{ steps.pack.outputs.zipname }}`**
            * Berkas Biner Mentah (*Raw Kernel Images*) tersedia pada lampiran di bawah ini.
          files: |
            \${{ steps.pack.outputs.zipname }}
            release/Image.gz-dtb
            release/Image
            release/Image.gz
          fail_on_unmatched_files: false

      - name: 🛡️ Mengunggah Dokumen Log Kompilasi (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-\${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7
